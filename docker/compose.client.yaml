# docker compose — CLIENT T4C fenêtré (VNC/noVNC).
# Le serveur T4C Python tourne directement sur l'hôte :
#     bash start_server.sh          (dans le dépôt, sur l'hôte)
# Le conteneur le joint via host.docker.internal (par défaut).
# Pour pointer ailleurs (VM XP, autre machine) :
#     T4C_SERVER_HOST=192.168.1.x docker compose -f compose.client.yaml up -d
# Usage :
#   T4C_SERVER_HOST=192.168.1.x docker compose -f compose.client.yaml up -d --build
#   puis http://<hôte>:6080/vnc.html
services:
  t4c-client:
    build:
      context: ${T4C_REPO_DIR:-..}
      dockerfile: docker/Dockerfile.client
    image: t4c-client:125
    container_name: t4c-client
    environment:
      T4C_SERVER_HOST: "${T4C_SERVER_HOST:-host.docker.internal}"
      WINEDEBUG: "-all"
      PULSE_SERVER: "${PULSE_SERVER:-host.docker.internal:4713}"
    ports:
      - "5900:5900"       # VNC (mot de passe : t4c)
      - "6080:6080"       # noVNC (navigateur)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stdin_open: true
    tty: true
