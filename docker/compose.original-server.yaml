# docker compose — SERVEUR ORIGINAL (T4C Server.exe sous Wine).
# STATUT : expérimental (boucle de redémarrage en détaché ; la VM XP
# le fait tourner). Serveur recommandé : compose.python.yaml (Python).
services:
  t4c-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: t4c-server:125
    container_name: t4c-server
    ports:
      - 0.0.0.0:11677:11677/udp
      - 0.0.0.0:11678:11678/udp
    environment:
      T4C_PORT: 11677
      WINEDEBUG: -all
    volumes:
      - t4c_db:/opt/t4c/db
      - t4c_logs:/opt/t4c/Logs
    restart: unless-stopped
    stdin_open: True
    tty: True
volumes:
  t4c_db:
  t4c_logs:
