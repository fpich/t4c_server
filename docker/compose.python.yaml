# docker compose — SERVEUR PYTHON T4C (réimplémentation du dépôt).
# Séparé du serveur original (Wine) : chacun son compose, ses tests, sa vie.
# Usage :
#   docker compose -f compose.python.yaml up -d --build
#   docker compose -f compose.python.yaml logs -f
networks:
  t4cnet:
    name: t4cnet

services:
  t4c-python:
    build:
      context: ../..
      dockerfile: docker/python-server/Dockerfile
    image: t4c-python:latest
    container_name: t4c-python
    # Écoute UDP 11677 (protocole validé jusqu'aux mouvements — 48 tests).
    ports:
      - "0.0.0.0:11677:11677/udp"
    environment:
      T4C_PORT: "11677"
    volumes:
      # Persistance SQLite (comptes, personnages, positions).
      - t4c_python_db:/data
    restart: unless-stopped
    networks:
      - t4cnet

volumes:
  t4c_python_db:
