# docker compose : serveur T4C original + client T4C fenêtré (VNC/noVNC + son).
# Usage :
#   docker compose up -d --build
#   docker compose logs -f
services:
  t4c-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: t4c-server:125
    container_name: t4c-server
    # Le serveur original écoute en UDP 11677 (0x2D9D confirmé dans le binaire).
    ports:
      # RECV (11677) : les clients s'y connectent.
      # SEND (11678) : le serveur émet depuis ce port (défaut binaire 0x2D9E).
      - "0.0.0.0:11677:11677/udp"
      - "0.0.0.0:11678:11678/udp"
    environment:
      T4C_PORT: "11677"
      WINEDEBUG: "-all"
    volumes:
      # Persistance : comptes/personnages (T4C.mdb) et logs du serveur.
      - t4c_db:/opt/t4c/db
      - t4c_logs:/opt/t4c/Logs
    restart: unless-stopped
    # TTY réel requis : T4C Server.exe exige une console interactive et
    # sort proprement (code 0) sans elle. Confirmé par test : avec -it,
    # le serveur démarre et écoute sur 11677/11678.
    stdin_open: true
    tty: true

  # Client T4C en mode fenêtré, visible en VNC (5900) / noVNC (6080).
  # Le son du client est transmis à PulseAudio de l'hôte (PULSE_SERVER).
  t4c-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    image: t4c-client:125
    container_name: t4c-client
    depends_on:
      - t4c-server
    environment:
      # Le client joint le conteneur serveur par son nom Docker.
      T4C_SERVER_HOST: t4c-server
      WINEDEBUG: "-all"
      # Son : PulseAudio de l'hôte doit écouter en réseau (module-native-
      # protocol-tcp). PulseAudio route la sortie Wine vers les haut-parleurs
      # de l'hôte pendant que l'image est affichée via noVNC.
      PULSE_SERVER: "${PULSE_SERVER:-host.docker.internal:4713}"
    ports:
      - "5900:5900"       # VNC (mot de passe : t4c)
      - "6080:6080"       # noVNC (navigateur) : http://<hôte>:6080/vnc.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  t4c_db:
  t4c_logs:
